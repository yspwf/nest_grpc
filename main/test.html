<!-- public/index.html -->
<!DOCTYPE html>
<htmllang="en">
<head>
<metacharset="UTF-8">
<metaname="viewport"content="width=device-width, initial-scale=1.0">
<title>Node.js WebSocket 聊天室</title>
<style>
    body { font-family: sans-serif; max-width: 800px; margin: 0 auto; padding: 20px; }
    #messages { border: 1px solid #ccc; height: 400px; overflow-y: auto; padding: 10px; margin-bottom: 10px; }
    #messagesdiv { margin-bottom: 8px; padding: 8px; border-radius: 4px; }
    #messages.system { background-color: #f0f0f0; color: #666; font-style: italic; }
    #messages.user { background-color: #e3f2fd; }
    #messageInput { width: calc(100% - 120px); padding: 8px; }
    #sendBtn { width: 100px; padding: 8px; }
</style>
</head>
<body>
<h1>简易聊天室</h1>
<divid="messages"></div>
<inputtype="text"id="usernameInput"placeholder="请输入你的昵称"value="用户">
<inputtype="text"id="messageInput"placeholder="请输入消息...">
<buttonid="sendBtn">发送</button>

<script>
    // 连接到 WebSocket 服务器
    const ws = new WebSocket('ws://localhost:3000/ws');

    const messagesDiv = document.getElementById('messages');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const usernameInput = document.getElementById('usernameInput');

    // 1. 连接成功时触发
    ws.onopen = () => {
      console.log('✅ 已连接到 WebSocket 服务器');
      appendMessage('系统：已成功连接到聊天室！', 'system');
    };

    // 2. 接收到服务器消息时触发
    ws.onmessage = (event) => {
      console.log(`📥 收到消息: ${event.data}`);
      const data = JSON.parse(event.data);
      if (data.type === 'SYSTEM') {
        appendMessage(`系统：${data.message}`, 'system');
      } else if (data.type === 'MESSAGE') {
        appendMessage(`${data.username}: ${data.message}`, 'user');
      } else {
        appendMessage(`原始消息: ${data.message}`, 'system');
      }
    };

    // 3. 连接关闭时触发
    ws.onclose = () => {
      console.log('🔌 与服务器的连接已关闭');
      appendMessage('系统：与服务器的连接已断开...', 'system');
    };

    // 4. 连接发生错误时触发
    ws.onerror = (error) => {
      console.error('❌ WebSocket 错误:', error);
      appendMessage(`系统：连接出错！${error.message}`, 'system');
    };

    // 发送消息
    sendBtn.addEventListener('click', () => {
      const message = messageInput.value.trim();
      const username = usernameInput.value.trim() || '匿名用户';
      if (message && ws.readyState === WebSocket.OPEN) {
        // 发送JSON格式的消息
        ws.send(JSON.stringify({ username, message }));
        messageInput.value = '';
      }
    });

    // 按下回车键发送消息
    messageInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        sendBtn.click();
      }
    });

    // 辅助函数：在页面上追加消息
    function appendMessage(text, type = '') {
      const messageDiv = document.createElement('div');
      messageDiv.textContent = text;
      if (type) {
        messageDiv.classList.add(type);
      }
      messagesDiv.appendChild(messageDiv);
      // 自动滚动到底部
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }
</script>
</body>
</html>
